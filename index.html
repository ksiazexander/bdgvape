<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDGVAPE — Sklep Vape Bydgoszcz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }
        a { color: inherit; text-decoration: none; }

        .topbar { background: #000; padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1a1a1a; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
        .logo span { color: #666; font-weight: 400; font-size: 0.75rem; margin-left: 10px; letter-spacing: 3px; }
        .btn-kontakt { background: transparent; color: #fff; border: 1px solid #333; padding: 9px 22px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.25s; }
        .btn-kontakt:hover { background: #fff; color: #000; border-color: #fff; }

        .hero { padding: 80px 40px 60px 40px; text-align: center; border-bottom: 1px solid #1a1a1a; }
        .hero .top-info { color: #555; font-size: 0.75rem; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; }
        .hero h1 { font-size: 6.5rem; font-weight: 900; letter-spacing: 8px; color: #fff; line-height: 1; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 40px rgba(255,255,255,0.15), 0 0 80px rgba(255,255,255,0.05); }
        .hero .opis { font-size: 1.1rem; color: #bbb; max-width: 650px; margin: 0 auto 6px auto; line-height: 1.6; font-weight: 300; }
        .hero .dol { color: #666; font-size: 0.9rem; letter-spacing: 1px; max-width: 650px; margin: 0 auto 25px auto; line-height: 1.6; font-weight: 300; }

        .btn-gdzie {
            background: transparent;
            color: #fff;
            border: 1px solid #444;
            padding: 12px 26px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-gdzie:hover { background: #fff; color: #000; border-color: #fff; }

        .sekcja { padding: 50px 40px 80px 40px; max-width: 1400px; margin: 0 auto; }
        .sekcja .naglowek { color: #555; font-size: 0.75rem; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 8px; }
        .sekcja h2 { font-size: 2.2rem; font-weight: 800; color: #fff; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; }

        .katalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }

        .kafelek { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 10px; overflow: hidden; transition: all 0.3s ease; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .kafelek:hover { border-color: #333; transform: translateY(-6px); box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 0 30px rgba(255,255,255,0.04); }
        .kafelek .zdjecie { width: 100%; height: 220px; object-fit: cover; background: #141414; }
        .kafelek .tresc { padding: 16px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .kafelek h3 { font-size: 1rem; color: #fff; font-weight: 700; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; line-height: 1.3; }
        .kafelek .cena { color: #fff; font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
        .kafelek .ilosc { color: #666; font-size: 0.8rem; margin-bottom: 10px; letter-spacing: 1px; }
        .kafelek .smaki-lista { color: #999; font-size: 0.78rem; line-height: 1.5; margin-bottom: 14px; text-align: left; padding: 8px 10px; background: #111; border-radius: 6px; }
        .kafelek .smaki-lista .smak-wiersz { display: flex; justify-content: space-between; }
        .kafelek .smaki-lista .smak-wiersz span:last-child { color: #fff; font-weight: 600; }
        .kafelek .btn-kup { background: #fff; color: #000; border: none; padding: 11px 20px; border-radius: 4px; font-weight: 700; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; width: 100%; }
        .kafelek .btn-kup:hover { background: #ccc; }

        .footer { border-top: 1px solid #1a1a1a; padding: 35px 20px; text-align: center; color: #444; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }

        .modal-tlo { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(6px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .modal-tlo.aktywny { display: flex; }

        .modal { background: #0a0a0a; border: 1px solid #333; border-radius: 12px; padding: 45px; max-width: 450px; width: 100%; text-align: center; position: relative; box-shadow: 0 20px 80px rgba(0,0,0,0.9); }
        .modal h3 { color: #fff; font-size: 1.1rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; }
        .modal p { color: #ccc; font-size: 1.1rem; font-weight: 500; letter-spacing: 1px; }

        .zamknij {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.08);
            border: 1px solid #444;
            border-radius: 50%;
            color: #fff;
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10;
            padding: 0;
            font-weight: 300;
        }
        .zamknij:hover { background: #fff; color: #000; border-color: #fff; }

        .modal-produkt { background: #0a0a0a; border: 1px solid #333; border-radius: 12px; max-width: 900px; width: 100%; padding: 40px; position: relative; box-shadow: 0 20px 80px rgba(0,0,0,0.9); display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .modal-produkt .lewa img { width: 100%; border-radius: 8px; background: #141414; object-fit: cover; max-height: 400px; }
        .modal-produkt .prawa { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .modal-produkt .kategoria { color: #666; font-size: 0.7rem; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 10px; }
        .modal-produkt h2 { font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; line-height: 1.1; word-break: break-word; }
        .modal-produkt .cena-duza { color: #fff; font-size: 1.8rem; font-weight: 800; margin-bottom: 25px; }
        .modal-produkt .opis-label { color: #666; font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 12px; }

        .osiedle-blok { background: #111; border: 1px solid #1f1f1f; border-radius: 8px; padding: 12px 15px; margin-bottom: 10px; }
        .osiedle-naglowek { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #1f1f1f; }
        .osiedle-nazwa { color: #fff; font-weight: 700; font-size: 0.9rem; letter-spacing: 1px; }
        .osiedle-ilosc { color: #888; font-size: 0.8rem; letter-spacing: 1px; font-weight: 600; }
        .smak-linia { display: flex; justify-content: space-between; padding: 3px 0; font-size: 0.82rem; color: #bbb; }
        .smak-linia .smak-nazwa { color: #ccc; }
